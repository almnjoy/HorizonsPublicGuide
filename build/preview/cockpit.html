    #horizon12-v2-refined .cx-grid{display:grid;grid-template-columns:1.42fr .58fr;height:864px}
    #horizon12-v2-refined .cx-left{position:relative;padding:38px;display:flex;flex-direction:column}
    #horizon12-v2-refined .cx-screen{flex:1;border-radius:26px;border:1px solid rgba(255,255,255,.14);background:radial-gradient(circle at 72% 18%,rgba(255,106,0,.16),transparent 42%),linear-gradient(150deg,#12181f,#080b10);display:flex;flex-direction:column;padding:40px;overflow:hidden}
    #horizon12-v2-refined .cx-badge{align-self:flex-start;padding:10px 18px;border-radius:999px;background:rgba(49,202,188,.15);border:1px solid var(--teal);color:var(--teal);font-size:21px;letter-spacing:.05em}
    #horizon12-v2-refined .cx-np{margin-top:auto}
    #horizon12-v2-refined .cx-track{font-size:64px;line-height:1;margin:12px 0 6px}
    #horizon12-v2-refined .cx-track.np-idle{color:#6b7379}
    #horizon12-v2-refined .cx-artist{font-size:28px;color:#b3bbc2;margin-bottom:14px}
    #horizon12-v2-refined .cx-transport{display:flex;gap:26px;align-items:center;margin-top:24px}
    #horizon12-v2-refined .cx-transport span{width:84px;height:84px;border-radius:50%;background:#1b222c;border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer}
    #horizon12-v2-refined .cx-transport span.big{width:104px;height:104px;background:var(--orange);color:#0a0b0d;border-color:var(--orange);font-size:46px}
    #horizon12-v2-refined .cx-open{margin-top:22px;text-align:center;padding:24px;border-radius:18px;background:var(--orange);color:#0a0b0d;font-size:29px;cursor:pointer;letter-spacing:.04em}
    #horizon12-v2-refined .cx-right{background:linear-gradient(160deg,#161c23,#0b0e12);border-left:3px solid #05070a;padding:34px 26px}
    #horizon12-v2-refined .cx-climate{display:flex;align-items:center;justify-content:space-between;gap:14px;background:#1b2129;border:1px solid #363d44;border-radius:18px;padding:16px 18px;margin:16px 0 22px}
    #horizon12-v2-refined .cx-climate>span{width:66px;height:66px;border-radius:14px;background:#0f1418;border:1px solid #39424a;display:flex;align-items:center;justify-content:center;font-size:38px;cursor:pointer;-webkit-user-select:none;user-select:none}
    #horizon12-v2-refined .cx-temp{text-align:center}
    #horizon12-v2-refined .cx-temp b{display:block;font-size:52px;color:var(--orange);line-height:1}
    #horizon12-v2-refined .cx-temp span{display:block;font-size:16px;color:#96a0a7}
    #horizon12-v2-refined .cx-tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    #horizon12-v2-refined .cx-tile{display:flex;flex-direction:column;align-items:center;gap:10px;background:#1b2129;border:1px solid #363d44;border-radius:16px;padding:22px 10px;font-size:20px;cursor:pointer}
    #horizon12-v2-refined .cx-tile b{width:52px;height:52px;border-radius:13px;background:#2a3038;display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--orange)}
  </style>
  <div class="v2-stage"><div class="v2-screen" aria-live="polite"></div></div>
  <div id="hzToast"></div>
  <script>
    (()=>{
      const root=document.getElementById('horizon12-v2-refined');
      const screen=root.querySelector('.v2-screen');
      const stage=root.querySelector('.v2-stage');
      const wave=Array.from({length:34},(_,i)=>`<i style="--h:${22+((i*37)%70)}px"></i>`).join('');

      const S=window.HZ_STATE=window.HZ_STATE||{trailTab:'GAUGES',temp:72,fan:4,ac:true,auto:true,recirc:true,front:false,rear:false,air:'FACE + FEET',screen:'mojave-home'};
      const L=()=>window.HZ_LAST||{};
      const num=(v)=>(v==null||v===''||isNaN(v))?null:(+v);
      const show=(v,dec)=>v==null?'--':(dec?(Math.round(v*Math.pow(10,dec))/Math.pow(10,dec)):Math.round(v));
      const CARD8=['N','NE','E','SE','S','SW','W','NW'];
      const CARDL=['NORTH','NORTHEAST','EAST','SOUTHEAST','SOUTH','SOUTHWEST','WEST','NORTHWEST'];
      const cardOf=(d,arr)=>{d=num(d);return d==null?'--':arr[Math.round((((d%360)+360)%360)/45)%8];};
      const gearName=(g)=>({1:'N',2:'R',4:'P',8:'D',16:'1',32:'2',64:'3',128:'4',256:'5',512:'6'}[+g]||('G'+g));

      const NAV=[['HOME','mojave-home','⌂'],['MUSIC','music-audio','♫'],['TRAIL','trail-gauges','4×4'],['OFF ROAD','offroad-hero','⛰'],['CLIMATE','climate','❄'],['SPLIT','split-shell','▥']];
      const LAUNCH=[['CAMERA','com.skypine.camera/.backcar.CameraActivity','▣'],['HDMI','com.skypine.camera/.hdmi.HDMIActivity','▰'],['CARPLAY','com.skypine.carplay/.CarPlayActivity','◉']];

      const top=(name='ALMNJOY / MOJAVE')=>`<div class="top"><div class="brand">${name}</div><div class="status"><span class="dim" id="hzDate">--</span><span id="hzTime">--:--</span><span id="hzClock" data-nav="gladiator-hero" class="teal">CARPLAY ●</span><span>LTE</span></div></div>`;
      const dock=(cur='mojave-home')=>{
        const nav=NAV.map(([lbl,id,ic])=>`<div class="dock-item ${cur===id?'on':''}" data-nav="${id}"><b>${ic}</b>${lbl}</div>`).join('');
        const launch=LAUNCH.map(([lbl,cmp,ic])=>`<div class="dock-item launch" data-launch="${cmp}"><b>${ic}</b>${lbl}</div>`).join('');
        return `<div class="dock"><div class="dock-group">${nav}</div><div class="dock-group">${launch}<div class="climate" data-nav="climate"><span>${S.auto?'AUTO':'MAN'}</span><strong>${S.temp}°</strong><span>FAN ${S.fan}</span></div></div></div>`;
      };

      function ring(val,min,max,unit,label){
        const R=52,C=2*Math.PI*R;
        const pct=(val==null)?0:Math.max(0,Math.min(1,(val-min)/(max-min)));
        const off=C*(1-pct);
        return `<div class="ring"><svg viewBox="0 0 130 130"><circle class="ring-bg" cx="65" cy="65" r="${R}"/><circle class="ring-fg" cx="65" cy="65" r="${R}" style="stroke-dasharray:${C.toFixed(1)};stroke-dashoffset:${off.toFixed(1)}"/></svg><div class="ring-c"><b>${show(val,unit==='V'?1:0)}<u>${unit}</u></b><span>${label}</span></div></div>`;
      }
      function attitude(pitch,roll){
        const p=num(pitch),r=num(roll);
        return `<div class="attitude"><div class="horizon" style="transform:rotate(${(-(r||0)).toFixed(1)}deg) translateY(${((p||0)*2.2).toFixed(0)}px)"></div><div class="att-mark"></div></div><div class="att-read"><div><b>${show(p,0)}°</b><span>PITCH</span></div><div><b>${show(r,0)}°</b><span>ROLL</span></div></div>`;
      }
      function compass(deg){
        const d=num(deg);
        return `<div class="compass"><div class="rose" style="transform:rotate(${d==null?0:(-d).toFixed(0)}deg)"><span class="cd n">N</span><span class="cd e">E</span><span class="cd s">S</span><span class="cd w">W</span></div><div class="cneedle"></div><div class="compass-c"><b>${cardOf(d,CARD8)}</b><span>${d==null?'--':Math.round(d)+'°'}</span></div></div>`;
      }
      const axleHTML=`<div class="axle"><div class="axle-line"></div><div class="axle-bar front"></div><div class="axle-bar rear"></div><div class="diff front">F</div><div class="diff rear">R</div><div class="wheel fl"></div><div class="wheel fr"></div><div class="wheel rl"></div><div class="wheel rr"></div><div class="lock">4×4 / CONNECTED</div></div>`;

      const TRAIL_TABS=['GAUGES','PERFORMANCE','VEHICLE INFO','DRIVETRAIN','OFF ROAD','SETTINGS'];
      function trailBody(){
        const l=L();
        if(!['GAUGES','PERFORMANCE','VEHICLE INFO','DRIVETRAIN','SETTINGS'].includes(S.trailTab)) S.trailTab='GAUGES';
        if(S.trailTab==='GAUGES')return `<div class="gauge-area"><div class="gauge-panel"><h2>LIVE VEHICLE DATA</h2><div class="round-grid">${ring(num(l.oil),100,260,'°','OIL TEMP')}${ring(num(l.outsideTemp),0,120,'°','OUTSIDE')}${ring(num(l.fuel_pct),0,100,'%','FUEL')}${ring(num(l.speed),0,120,'','MPH')}</div></div><div class="gauge-panel center-panel"><h2>ATTITUDE</h2>${attitude(l.pitch,l.roll)}</div><div class="gauge-panel"><h2>HEADING · ALTITUDE</h2><div class="ha-grid">${compass(l.heading)}<div class="alt-read"><b>${show(num(l.altitude),0)}</b><span>FT ALTITUDE</span><b style="margin-top:20px">${l.gear!=null?gearName(l.gear):'--'}</b><span>GEAR</span></div></div></div></div>`;
        if(S.trailTab==='PERFORMANCE')return `<div class="gauge-area"><div class="gauge-panel"><h2>SPEED · GPS</h2><div class="round-grid" style="grid-template-columns:1fr">${ring(num(l.speed),0,120,'','MPH')}</div></div><div class="gauge-panel center-panel"><h2>G-FORCE / TILT</h2>${attitude(l.pitch,l.roll)}</div><div class="gauge-panel"><h2>HEADING</h2><div class="ha-grid" style="grid-template-columns:1fr">${compass(l.heading)}</div></div></div>`;
        if(S.trailTab==='VEHICLE INFO')return `<div class="gauge-area one"><div class="gauge-panel wide"><h2>VEHICLE INFO</h2><div class="vinfo"><div class="vi"><span>MODEL</span><b>JEEP GLADIATOR</b></div><div class="vi"><span>TRIM</span><b>MOJAVE</b></div><div class="vi"><span>DRIVE</span><b>4×4</b></div><div class="vi"><span>SPEED</span><b>${show(num(l.speed),0)} MPH</b></div><div class="vi"><span>BATTERY</span><b>${show(num(l.voltage),1)} V</b></div><div class="vi"><span>ALTITUDE</span><b>${show(num(l.altitude),0)} FT</b></div><div class="vi"><span>HEADING</span><b>${cardOf(l.heading,CARD8)}</b></div><div class="vi"><span>OUTSIDE</span><b>${show(num(l.outsideTemp),0)}°</b></div><div class="vi"><span>PITCH / ROLL</span><b>${show(num(l.pitch),0)}° / ${show(num(l.roll),0)}°</b></div></div></div></div>`;
        if(S.trailTab==='DRIVETRAIN')return `<div class="gauge-area one"><div class="gauge-panel wide center-panel"><h2>DRIVETRAIN · 4×4</h2>${axleHTML}</div></div>`;
        if(S.trailTab==='SETTINGS')return `<div class="gauge-area one"><div class="gauge-panel wide"><h2>USER SETTINGS</h2><div class="vinfo"><div class="vi" data-nav="mojave-home"><span>GO TO</span><b>HOME</b></div><div class="vi"><span>UNITS</span><b>IMPERIAL</b></div><div class="vi"><span>THEME</span><b>MOJAVE ORANGE</b></div><div class="vi"><span>GAUGE SOURCE</span><b>SENSORS + GPS</b></div><div class="vi" data-launch="com.skypine.carplay/.CarPlayActivity"><span>PHONE</span><b>CARPLAY</b></div><div class="vi"><span>BUILD</span><b>HORIZON v1.1</b></div></div></div></div>`;
        return '';
      }

      function render(id){
        let html='';
        if(id==='mojave-home'){const l=L();const tk=l.track||'NOTHING PLAYING';const ar=l.artist||(l.source?l.source.toUpperCase():'SELECT A SOURCE');
          html=`<section class="home">${top()}<div class="home-grid"><div class="home-left"><div class="music-card glass"><div class="eyebrow">NOW PLAYING${l.source?' / '+l.source.toUpperCase():''}</div><div class="track ${l.track?'':'np-idle'}" id="hzTrack">${tk}</div><div class="artist ${l.track?'':'np-idle'}" id="hzArtist">${ar}</div><div class="wave">${wave}</div><div class="progress"><i></i></div><div class="player-row"><div class="play" data-launch="com.skypine.carplay/.CarPlayActivity">Ⅱ</div><span class="subhead">◀　▶</span><span class="body orange">VOL ${l.vol!=null?l.vol:'--'}</span></div></div><div class="quick-row"><div class="quick" data-launch="com.skypine.carplay/.CarPlayActivity"><span>◉</span><b>CARPLAY</b><small class="dim">CONNECTED</small></div><div class="quick" data-launch="com.skypine.camera/.backcar.CameraActivity"><span>▣</span><b>CAMERAS</b><small class="dim">READY</small></div><div class="quick" data-launch="com.skypine.camera/.hdmi.HDMIActivity"><span>▰</span><b>HDMI</b><small class="dim">INPUT 1</small></div></div></div><div class="home-right"><img class="jeep-cut" src="./assets/jeep-surfboard-cutout.webp" alt="Jeep Gladiator Mojave"><div class="jeep-copy"><div><div class="eyebrow">VEHICLE STATUS</div><strong>${(num(l.speed)||0)>2?'DRIVING':'PARKED / READY'}</strong></div><div class="body">MOJAVE / 4×4</div></div></div></div>${dock(id)}</section>`;}
        if(id==='music-audio'){const l=L();const src=(l.source||'').toUpperCase();const on=(x)=>src.indexOf(x)>=0?'on':'';
          html=`<section class="music-page">${top('ALMNJOY / MUSIC')}<div class="music-copy"><div class="eyebrow">AUDIO / MUSIC / RADIO</div><div class="source-row"><span class="source ${on('CARPLAY')||on('SPOTIFY')}" data-launch="com.skypine.carplay/.CarPlayActivity">SPOTIFY</span><span class="source ${on('FM')||on('RADIO')}" data-launch="com.skypine.hdradio/.ui.activity.HDRadioMainActivity">FM RADIO</span><span class="source ${on('BLUETOOTH')||on('BT')}" data-launch="com.skypine.bluetoothui/.ui.activity.BTMusicActivity">BLUETOOTH</span><span class="source ${on('USB')}" data-launch="com.skypine.media/.ui.activity.MainActivity">USB</span></div><h1 id="hzTrack2" class="${l.track?'':'np-idle'}">${l.track?l.track:'NOTHING<br>PLAYING'}</h1><div class="subhead" id="hzArtist2">${l.artist||'TAP A SOURCE ABOVE TO START'}</div><div class="listen-card"><div class="album-orb"></div><div><span class="eyebrow">ALBUM</span><strong>${l.album||'--'}</strong><div class="music-progress"><div class="progress"><i style="width:${l.progress||0}%"></i></div><span>${l.pos||'--'} / ${l.dur||'--'}</span></div></div><div class="listen-actions" data-launch="com.skypine.carplay/.CarPlayActivity">◀　Ⅱ　▶</div></div></div><div class="lanes"><div class="lane yellow" data-launch="com.skypine.media/.ui.activity.MainActivity"><span>USB LIBRARY</span><b>BROWSE FILES</b><span>OPEN USB MEDIA</span></div><div class="lane tealbg" data-launch="com.skypine.bluetoothui/.ui.activity.BTMusicActivity"><span>CURRENT SOURCE</span><b>${src||'NONE'}</b><span>${l.track?'NOW PLAYING':'NO MEDIA'}</span></div><div class="lane coral" data-launch="com.skypine.hdradio/.ui.activity.HDRadioMainActivity"><span>RADIO</span><b>FM / HD RADIO</b><span>OPEN TUNER</span></div></div>${dock(id)}</section>`;}
        if(id==='gladiator-hero'){const l=L();
          html=`<section class="gladiator">${top()}<div class="glad-copy"><div class="eyebrow" id="hzDate2">--</div><h1 id="hzBig">--:--</h1><div class="subhead">${l.track?('▶ '+l.track):'CARPLAY READY'} · ${S.temp}° · FAN ${S.fan}</div><div style="display:flex;gap:14px;margin-top:34px"><div class="btn primary" data-nav="music-audio">▶ MUSIC</div><div class="btn" data-launch="com.skypine.carplay/.CarPlayActivity">OPEN CARPLAY</div></div></div><div class="glad-cards"><div class="mini">ALTITUDE<b>${show(num(l.altitude),0)} FT</b></div><div class="mini">HEADING<b>${cardOf(l.heading,CARD8)}</b></div></div><img class="glad-jeep" src="./assets/jeep-surfboard-cutout.webp" alt="Jeep Gladiator Mojave"><div class="glad-line"></div>${dock(id)}</section>`;}
        if(id==='trail-gauges'){
          const tabs=TRAIL_TABS.map(t=> t==='OFF ROAD'
            ? `<span class="trail-tab" data-nav="offroad-hero">${t}</span>`
            : `<span class="trail-tab ${S.trailTab===t?'on':''}" data-trailtab="${t}">${t}</span>`).join('');
          html=`<section class="trail">${top('MOJAVE / VEHICLE DATA')}<div class="trail-tabs">${tabs}</div>${trailBody()}${dock(id)}</section>`;}
        if(id==='offroad-hero'){const l=L();
          html=`<section class="offroad">${top('ALMNJOY / OFFROAD')}<div class="off-copy"><div class="eyebrow">TRAIL VIEW / ACTIVE</div><h1>OFF ROAD</h1><div class="subhead">${show(num(l.outsideTemp),0)}° OUTSIDE · ${show(num(l.speed),0)} MPH</div></div><div class="off-facts"><div class="off-fact"><span class="dim">HEADING</span><b>${cardOf(l.heading,CARDL)}</b></div><div class="off-fact"><span class="dim">ALTITUDE</span><b>${show(num(l.altitude),0)} FT</b></div><div class="off-fact"><span class="dim">PITCH / ROLL</span><b>${show(num(l.pitch),0)}° / ${show(num(l.roll),0)}°</b></div></div>${dock(id)}</section>`;}
        if(id==='climate'){
          const fan=[];for(let i=1;i<=6;i++)fan.push(`<i class="${i<=S.fan?'on':''}" style="--h:${18+i*11}px" data-fan="${i}"></i>`);
          const cc=(k,lbl)=>`<span class="climate-control ${S[k]?'on':''}" data-climatetoggle="${k}">${lbl}</span>`;
          html=`<section class="climate-screen">${top('MOJAVE / CLIMATE')}<div class="climate-grid"><div class="climate-side"><div class="eyebrow teal">CABIN TEMPERATURE</div><div class="degrees" id="hzTemp">${S.temp}<b>°</b></div><h2>${S.auto?'AUTO':'MANUAL'} / ${S.ac?'A/C':'ECO'}</h2><div class="body dim">OUTSIDE ${show(num(L().outsideTemp),0)}°</div><div class="temp-adjust"><span data-tempadj="-1">−</span><span data-tempadj="1">＋</span></div><div class="small dim" style="margin-top:12px">TAP ± OR DRAG THE NUMBER ↕</div></div><div class="cabin-flow"><svg viewBox="0 0 1000 650" role="img" aria-label="airflow"><defs><linearGradient id="airflow-gradient" x1="0" x2="1"><stop stop-color="#31cabc"/><stop offset="1" stop-color="#73d9ff"/></linearGradient><marker id="air-arrow" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#73d9ff"/></marker></defs><circle cx="392" cy="248" r="22" fill="rgba(49,202,188,.18)" stroke="#31cabc" stroke-width="5"/><circle cx="632" cy="248" r="22" fill="rgba(49,202,188,.18)" stroke="#31cabc" stroke-width="5"/><path d="M390 246 C322 212 240 162 156 88" fill="none" stroke="url(#airflow-gradient)" stroke-width="11" stroke-linecap="round" marker-end="url(#air-arrow)"/><path d="M634 246 C710 208 796 158 880 88" fill="none" stroke="url(#airflow-gradient)" stroke-width="11" stroke-linecap="round" marker-end="url(#air-arrow)"/><path d="M392 264 C330 334 262 418 184 536" fill="none" stroke="url(#airflow-gradient)" stroke-width="13" stroke-linecap="round" marker-end="url(#air-arrow)"/><path d="M632 264 C700 332 766 416 842 536" fill="none" stroke="url(#airflow-gradient)" stroke-width="13" stroke-linecap="round" marker-end="url(#air-arrow)"/><rect x="405" y="558" width="190" height="58" rx="18" fill="rgba(5,10,14,.88)" stroke="#31cabc" stroke-width="3"/><text x="500" y="597" text-anchor="middle" fill="#31cabc" font-size="31">${S.temp}° / ${S.auto?'AUTO':'MAN'}</text></svg></div><div class="climate-side"><div class="eyebrow teal">FAN SPEED</div><h2>LEVEL ${S.fan}</h2><div class="fan-stack">${fan.join('')}</div><div class="air-mode">${['FACE + FEET','FRONT DEFROST','RECIRCULATE'].map(a=>`<div class="air-option ${S.air===a?'on':''}" data-airmode="${a}"><span>${a}</span><b>${S.air===a?'●':'○'}</b></div>`).join('')}</div></div></div><div class="climate-controls">${cc('auto','AUTO')}${cc('ac','A/C')}${cc('front','FRONT')}${cc('rear','REAR')}${cc('recirc','RECIRC')}<span class="climate-control hot">${S.temp}°</span></div>${dock(id)}</section>`;}
        if(id==='split-shell'){const l=L();const tk=l.track||'NOTHING PLAYING';const ar=l.artist||(l.source?l.source.toUpperCase():'CONNECT A PHONE');
          const proj=(l.source&&(l.source.indexOf('CARPLAY')>=0||l.source.indexOf('ANDROID')>=0))?l.source:(l.track?'PHONE PROJECTION':'NOT CONNECTED');
          const tiles=[['▣','CAMERA','__launch:com.skypine.camera/.backcar.CameraActivity'],['▰','HDMI','__launch:com.skypine.camera/.hdmi.HDMIActivity'],['4×4','TRAIL','trail-gauges'],['⛰','OFF ROAD','offroad-hero'],['♫','MUSIC','music-audio'],['❄','CLIMATE','climate']].map(([ic,t,tgt])=>{const a=tgt.indexOf('__launch:')===0?`data-launch="${tgt.slice(9)}"`:`data-nav="${tgt}"`;return `<div class="cx-tile" ${a}><b>${ic}</b>${t}</div>`;}).join('');
          html=`<section class="csplit">${top('CARPLAY SPLIT')}<div class="cx-grid"><div class="cx-left"><div class="cx-screen"><div class="cx-badge">◉ ${proj}</div><div class="cx-np"><div class="eyebrow">NOW PLAYING</div><div class="cx-track ${l.track?'':'np-idle'}">${tk}</div><div class="cx-artist">${ar}</div><div class="wave">${wave}</div><div class="cx-transport"><span data-mediakey="prev">◀◀</span><span class="big" data-mediakey="play">⏯</span><span data-mediakey="next">▶▶</span></div></div><div class="cx-open" data-launch="com.skypine.carplay/.CarPlayActivity">OPEN CARPLAY / ANDROID AUTO ▸</div></div></div><div class="cx-right"><div class="eyebrow teal">COMPANION</div><div class="cx-climate"><span data-tempadj="-1">−</span><div class="cx-temp"><b>${S.temp}°</b><span>${S.auto?'AUTO':'MAN'} · FAN ${S.fan}</span></div><span data-tempadj="1">＋</span></div><div class="cx-tiles">${tiles}</div></div></div>${dock(id)}</section>`;}
        screen.innerHTML=html;
        window.HZ_SCREEN=id;S.screen=id;
        applyLive();
        try{history.replaceState(null,'',`?screen=${id}`)}catch(e){}
      }
      window.HZ_render=render;

      const toast=document.getElementById('hzToast');let toastT;
      function showToast(m){toast.textContent=m;toast.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>toast.classList.remove('show'),1800);}
      function launch(cmp){if(window.Horizon&&window.Horizon.launch){try{window.Horizon.launch(cmp);return;}catch(e){}}showToast('LAUNCH: '+cmp.split('/')[0].split('.').pop().toUpperCase());}
      function mediaKey(a){if(window.Horizon&&window.Horizon.mediaKey){try{window.Horizon.mediaKey(a);showToast(a==='play'?'⏯ PLAY / PAUSE':a==='next'?'▶▶ NEXT':'◀◀ PREV');return;}catch(e){}}showToast('MEDIA: '+a.toUpperCase());}
      // real HVAC control via the privileged helper bridge (no-op until the bridge exists)
      function setHvac(prop,val){try{if(window.Horizon&&window.Horizon.setHvac){window.Horizon.setHvac(prop,''+val);}}catch(e){}}

      const clampTemp=t=>Math.max(60,Math.min(85,t));
      screen.addEventListener('click',e=>{
        const tt=e.target.closest('[data-trailtab]');if(tt){S.trailTab=tt.getAttribute('data-trailtab');render('trail-gauges');return;}
        const ta=e.target.closest('[data-tempadj]');if(ta){S.temp=clampTemp(S.temp+(+ta.getAttribute('data-tempadj')));setHvac('temp',S.temp);render(S.screen);return;}
        const fn=e.target.closest('[data-fan]');if(fn){S.fan=+fn.getAttribute('data-fan');S.auto=false;S._fanTouched=true;setHvac('fan',S.fan);render(S.screen);return;}
        const am=e.target.closest('[data-airmode]');if(am){S.air=am.getAttribute('data-airmode');render(S.screen);return;}
        const cg=e.target.closest('[data-climatetoggle]');if(cg){const k=cg.getAttribute('data-climatetoggle');S[k]=!S[k];setHvac(k,S[k]?1:0);render(S.screen);return;}
        const mk=e.target.closest('[data-mediakey]');if(mk){mediaKey(mk.getAttribute('data-mediakey'));return;}
        const nav=e.target.closest('[data-nav]');if(nav){render(nav.getAttribute('data-nav'));return;}
        const lc=e.target.closest('[data-launch]');if(lc){launch(lc.getAttribute('data-launch'));}
      });
      // drag the temperature number vertically (climate)
      function dragStart(e){
        const dg=e.target.closest&&e.target.closest('#hzTemp');if(!dg)return;
        const startY=(e.touches?e.touches[0].clientY:e.clientY),startT=S.temp;e.preventDefault();
        const mv=ev=>{const y=(ev.touches?ev.touches[0].clientY:ev.clientY);S.temp=clampTemp(Math.round(startT+(startY-y)/12));const el=document.getElementById('hzTemp');if(el)el.innerHTML=S.temp+'<b>°</b>';};
        const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);document.removeEventListener('touchmove',mv);document.removeEventListener('touchend',up);render(S.screen);};
        document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);document.addEventListener('touchmove',mv,{passive:false});document.addEventListener('touchend',up);
      }
      screen.addEventListener('mousedown',dragStart);
      screen.addEventListener('touchstart',dragStart,{passive:false});

      const DAYS=['SUN','MON','TUE','WED','THU','FRI','SAT'];
      const DAYL=['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
      const MON=['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
      function setTxt(id,t){const e=document.getElementById(id);if(e)e.textContent=t;}
      function setHtml(id,t){const e=document.getElementById(id);if(e)e.innerHTML=t;}
      function applyLive(){
        const d=new Date();let h=d.getHours(),m=d.getMinutes();const ap=h>=12?'PM':'AM';let h12=h%12;if(h12===0)h12=12;const mm=m<10?'0'+m:m;
        setTxt('hzDate',DAYS[d.getDay()]+' '+(d.getMonth()+1)+'/'+d.getDate());
        setTxt('hzTime',h12+':'+mm+' '+ap);
        setTxt('hzDate2',DAYL[d.getDay()]+' / '+MON[d.getMonth()]+' '+d.getDate());
        setHtml('hzBig',h12+':'+mm+'<br>'+ap);
        const l=window.HZ_LAST;if(l){
          if(l.track){setTxt('hzTrack',l.track);setHtml('hzTrack2',l.track);}
          if(l.artist){setTxt('hzArtist',l.artist);setTxt('hzArtist2',l.artist);}
        }
      }
      // live data: re-render gauge screens so rings/needles update; else just refresh text
      let lastPush=0;
      /* Entry point for the left rail. The rail is a separate WebView in its own JS
   context, so its nav taps come in through native: ChromeOverlayService.nav()
   -> MainActivity.navTo() -> evaluateJavascript -> here. */
window.HorizonNav=function(screen){try{
  var ALIAS={home:'mojave-home',apps:'split-shell',music:'music-audio',trail:'trail-gauges',climate:'climate'};
  var id=ALIAS[screen]||screen;
  render(id);
}catch(e){}};
window.HorizonApply=function(data){try{if(typeof data==='string')data=JSON.parse(data);}catch(e){return;}if(!data)return;const l=window.HZ_LAST=Object.assign(window.HZ_LAST||{},data);
        // normalize raw SI values from the root poller into display units
        if(l.gspeed_ms!=null)l.speed=Math.round(l.gspeed_ms*2.23694);else if(l.speed_ms!=null)l.speed=Math.round(l.speed_ms*2.23694);
        if(l.oil_c!=null)l.oil=Math.round(l.oil_c*9/5+32);
        if(l.out_c!=null)l.outsideTemp=Math.round(l.out_c*9/5+32);
        if(l.alt_m!=null)l.altitude=Math.round(l.alt_m*3.28084);
        if(l.fan!=null&&window.HZ_STATE&&!window.HZ_STATE._fanTouched)window.HZ_STATE.fan=Math.max(1,Math.min(6,+l.fan));
        const now=Date.now();
        if((S.screen==='trail-gauges'||S.screen==='offroad-hero')&&now-lastPush>350){lastPush=now;render(S.screen);}
        else applyLive();
      };
      setInterval(applyLive,1000);

      // poll root-written live data (vehicle gauges, GPS altitude/heading/speed, HVAC, now-playing)
      function pollLive(){try{var x=new XMLHttpRequest();x.open('GET','live.json?_='+Date.now(),true);x.onreadystatechange=function(){if(x.readyState===4&&x.responseText){try{window.HorizonApply(JSON.parse(x.responseText));}catch(e){}}};x.send();}catch(e){}}
      setInterval(pollLive,2000);pollLive();

      const fit=()=>{const w=window.innerWidth||stage.clientWidth;const s=w/1920;screen.style.transform=`scale(${s})`;stage.style.height=`${1080*s}px`;stage.style.width='100vw';};
      addEventListener('resize',fit);
      const requested=new URLSearchParams(location.search).get('screen');
      render(['mojave-home','music-audio','gladiator-hero','trail-gauges','offroad-hero','climate','split-shell'].includes(requested)?requested:'mojave-home');
      fit();setTimeout(fit,80);setTimeout(fit,300);
    })();
  </script>
</div>
</body></html>
